<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سجل الحضور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0F1420; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2A3346; border-radius: 4px; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* أنماط التقرير القابل للطباعة - مفعّلة دائمًا حتى تظهر بنفس الشكل في المعاينة على الشاشة وعند الطباعة الفعلية */
  .printable-report-monthly, .printable-report-weekly {
    display: none;
    font-family: 'Cairo', sans-serif; color: #1a1a1a; background: #fff;
  }
  .pr-header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 10px;
  }
  .pr-title { font-size: 18px; font-weight: 800; margin: 0; }
  .pr-sub { font-size: 11px; color: #666; margin: 2px 0 0; }
  .pr-meta { font-size: 10px; color: #666; text-align: left; line-height: 1.6; }
  .pr-infobar {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .pr-info-card {
    flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 7px 10px; font-size: 11px; text-align: center;
  }
  .pr-info-card b { display: block; font-size: 13px; margin-top: 2px; }
  .pr-legend {
    display: flex; gap: 14px; font-size: 10px; color: #444; margin-bottom: 10px; flex-wrap: wrap;
  }
  .pr-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .pr-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .pr-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .pr-summary-card {
    border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; text-align: center;
  }
  .pr-summary-num { font-size: 16px; font-weight: 800; }
  .pr-summary-label { font-size: 9.5px; color: #666; }
  .printable-report-monthly table, .printable-report-weekly table { width: 100%; border-collapse: collapse; font-size: 9.5px; }
  .printable-report-monthly thead, .printable-report-weekly thead { display: table-header-group; }
  .printable-report-monthly tr, .printable-report-weekly tr { page-break-inside: avoid; }
  .printable-report-monthly th, .printable-report-monthly td,
  .printable-report-weekly th, .printable-report-weekly td {
    border: 1px solid #d5d5d5; padding: 4px 3px; text-align: center;
  }
  .printable-report-monthly th, .printable-report-weekly th {
    background: #1a1a1a !important; color: #fff !important; font-weight: 700;
  }
  .printable-report-monthly td:first-child, .printable-report-monthly th:first-child,
  .printable-report-weekly td:first-child, .printable-report-weekly th:first-child {
    text-align: right; font-weight: 600;
  }
  .printable-report-monthly tbody tr:nth-child(even),
  .printable-report-weekly tbody tr:nth-child(even) { background: #f7f7f7 !important; }
  .printable-report-monthly tfoot td, .printable-report-weekly tfoot td {
    font-weight: 800; background: #eee !important; border-top: 2px solid #1a1a1a;
  }
  .pr-status-badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-weight: 700;
  }
  .pr-notes { margin-top: 14px; font-size: 10px; }
  .pr-notes-title { font-weight: 800; margin-bottom: 4px; }
  .pr-notes ul { margin: 0; padding-right: 16px; }
  .pr-notes li { margin-bottom: 2px; }
  .pr-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px; font-size: 10px; color: #444;
  }
  .pr-sign-line { display: inline-block; min-width: 140px; border-bottom: 1px solid #444; margin-right: 6px; }

  @media print {
    @page { size: landscape; margin: 10mm; }
    html, body { background: #fff !important; }
    .app-shell { display: none !important; }
    .no-print { display: none !important; }
    body[data-print-mode="monthly"] .printable-report-monthly,
    body[data-print-mode="weekly"] .printable-report-weekly {
      display: block !important;
      position: static;
      width: 100%;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }

  #fallback-msg {
    display: none; font-family: sans-serif; color: #F87171; background: #171E2E;
    padding: 16px; margin: 16px; border-radius: 10px; direction: rtl; text-align: right;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback-msg">تعذّر تحميل التطبيق. تأكد من الاتصال بالإنترنت وحدّث الصفحة.</div>
<script>
  window.__mounted = false;
  window.__lastError = null;
  window.addEventListener("error", function (ev) {
    window.__lastError = (ev.error && ev.error.message) || ev.message || "خطأ غير معروف";
    showFallback();
  });
  window.addEventListener("unhandledrejection", function (ev) {
    window.__lastError = (ev.reason && ev.reason.message) || String(ev.reason) || "خطأ غير معروف";
    showFallback();
  });
  function showFallback() {
    var el = document.getElementById("fallback-msg");
    if (!el) return;
    if (window.__lastError) {
      el.innerHTML = "تعذّر تحميل التطبيق. تفاصيل الخطأ (ابعتها لمن يساعدك):<br><code style='font-family:monospace; direction:ltr; display:block; margin-top:8px; word-break:break-all;'>" + window.__lastError + "</code>";
    }
    el.style.display = "block";
  }
  window.showFallback = showFallback;
  setTimeout(function () {
    if (!window.__mounted) showFallback();
  }, 6000);
</script>
<script src="app.js"></script>
</body>
</html>
